name: Build AURA Native Module

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build-native.yml"
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - "preload.js"
      - "index.html"

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure native build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          node --version
          npm --version
          & $python --version

      - name: Install dependencies without native install scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $electronInstallScript = Join-Path $env:GITHUB_WORKSPACE "node_modules\electron\install.js"
          if (!(Test-Path -LiteralPath $electronInstallScript -PathType Leaf)) {
            throw "Electron install script was not found: $electronInstallScript"
          }
          node $electronInstallScript

          $electronBinary = Join-Path $env:GITHUB_WORKSPACE "node_modules\electron\dist\electron.exe"
          if (!(Test-Path -LiteralPath $electronBinary -PathType Leaf)) {
            throw "Electron binary was not downloaded: $electronBinary"
          }

      - name: Verify Electron version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx --no-install electron --version

      - name: Rebuild naudiodon for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx --yes @electron/rebuild@3.7.1 --force --which-module naudiodon --version 28.3.3

      - name: Verify native module exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nativeModule = Join-Path $env:GITHUB_WORKSPACE "node_modules\naudiodon\build\Release\naudiodon.node"
          if (!(Test-Path -LiteralPath $nativeModule -PathType Leaf)) {
            throw "naudiodon.node was not created: $nativeModule"
          }

      - name: Verify naudiodon loads in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const electronVersion = process.versions.electron;
          const naudiodon = require('./node_modules/naudiodon');
          console.log(`Electron runtime: ${electronVersion}`);
          console.log('naudiodon loaded successfully');
          console.log(Object.keys(naudiodon));
          '@ | Set-Content -LiteralPath verify-naudiodon.cjs -Encoding utf8

          npx --no-install electron verify-naudiodon.cjs
          Remove-Item verify-naudiodon.cjs -Forceر
