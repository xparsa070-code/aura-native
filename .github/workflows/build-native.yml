name: Build AURA Native Module

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Rebuild naudiodon for Electron
        run: npx electron-rebuild -f -w naudiodon

      - name: Verify native module
        shell: pwsh
        run: |
          $path = "node_modules/naudiodon/build/Release/naudiodon.node"

          if (!(Test-Path $path)) {
            Write-Error "naudiodon.node was not created!"
            exit 1
          }

          Write-Host "SUCCESS: $path"
          Get-Item $path

      - name: Upload naudiodon binary
        uses: actions/upload-artifact@v4
        with:
          name: aura-naudiodon-win32-x64-electron28
          path: node_modules/naudiodon/build/Release/naudiodon.node
          if-no-files-found: error
