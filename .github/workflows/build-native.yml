name: Build AURA Native Module

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build-native.yml"
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - "preload.js"
      - "index.html"

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-2022

    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure native build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Node version:"
          node --version

          Write-Host "npm version:"
          npm --version

          Write-Host "Python version:"
          & $python --version

          Write-Host "Python executable: $python"

          Write-Host "Visual Studio installations:"
          Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\2022" `
            -Directory `
            -ErrorAction SilentlyContinue

      - name: Install dependencies without native install scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Rebuild naudiodon for the installed Electron version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npx --yes @electron/rebuild@3.7.1 `
            --force `
            --which-module naudiodon

      - name: Verify native module exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nativeModule = Join-Path `
            $env:GITHUB_WORKSPACE `
            "node_modules\naudiodon\build\Release\naudiodon.node"

          if (!(Test-Path -LiteralPath $nativeModule -PathType Leaf)) {
            throw "naudiodon.node was not created: $nativeModule"
          }

          Write-Host "Native module found:"
          Get-Item -LiteralPath $nativeModule

      - name: Verify Electron version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx electron --version

      - name: Verify naudiodon loads in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @'
          const naudiodon = require('./node_modules/naudiodon');

          console.log('naudiodon loaded successfully');
          console.log(Object.keys(naudiodon));
          '@ | Set-Content -Path verify-naudiodon.cjs -Encoding utf8

          npx electron verify-naudiodon.cjs
          Remove-Item verify-naudiodon.cjs -Force

      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: aura-naudiodon-win32-x64-electron28
          path: node_modules/naudiodon/build/Release/naudiodon.node
          if-no-files-found: error
