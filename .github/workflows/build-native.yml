name: Build AURA Native Module

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - ".github/workflows/build-native.yml"
      - "main.js"
      - "preload.js"
      - "index.html"
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/build-native.yml"
      - "main.js"
      - "preload.js"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_VERSION: "28.0.0"
  npm_config_arch: x64
  npm_config_platform: win32

jobs:
  build-native:
    name: Build naudiodon for AURA / Electron
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Windows x64 environment
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "package.json not found."
          }

          $platform = node -p "process.platform"
          $arch = node -p "process.arch"

          Write-Host "Node: $(node --version)"
          Write-Host "npm: $(npm --version)"
          Write-Host "Platform: $platform"
          Write-Host "Architecture: $arch"

          if ($platform -ne "win32") {
            throw "Expected Windows, got $platform"
          }

          if ($arch -ne "x64") {
            throw "Expected x64, got $arch"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --prefer-online

      - name: Verify installed dependencies
        shell: pwsh
        run: |
          npm list electron --depth=0
          npm list naudiodon --depth=0

          if (!(Test-Path "node_modules/electron")) {
            throw "Electron was not installed."
          }

          if (!(Test-Path "node_modules/naudiodon")) {
            throw "naudiodon was not installed."
          }

          $electron = node -p "require('./node_modules/electron/package.json').version"
          $naudiodon = node -p "require('./node_modules/naudiodon/package.json').version"

          "ELECTRON_VERSION=$electron" >> $env:GITHUB_ENV
          "NAUDIODON_VERSION=$naudiodon" >> $env:GITHUB_ENV

          Write-Host "Electron: $electron"
          Write-Host "naudiodon: $naudiodon"

      - name: Rebuild naudiodon for Electron
        shell: pwsh
        run: |
          npx --yes @electron/rebuild@3.7.1 --force --which-module=naudiodon

      - name: Verify native binary
        shell: pwsh
        run: |
          $native = "node_modules/naudiodon/build/Release/naudiodon.node"

          if (!(Test-Path $native)) {
            throw "Native binary was not created: $native"
          }

          $file = Get-Item $native
          Write-Host "Native binary: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 10000) {
            throw "Native binary is suspiciously small."
          }

          $bytes = [IO.File]::ReadAllBytes($native)

          if ($bytes.Length -lt 64) {
            throw "Invalid PE file."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw "Invalid PE header."
          }

          $signature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)

          if ($signature -ne "PE`0`0") {
            throw "Native module is not a PE file."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("PE Machine: 0x{0:X4}" -f $machine)

          if ($machine -ne 0x8664) {
            throw "Native module is not x64."
          }

      - name: Create Electron validation script
        shell: pwsh
        run: |
          @'
          const naudiodon = require('naudiodon');
          if (process.platform !== 'win32') throw new Error('Not Windows');
          if (process.arch !== 'x64') throw new Error('Not x64');

          for (const name of ['AudioIO', 'getDevices', 'SampleFormat16Bit', 'SampleFormat24Bit']) {
            if (!(name in naudiodon)) throw new Error(`Missing naudiodon export: ${name}`);
          }

          const devices = naudiodon.getDevices();
          if (!Array.isArray(devices)) throw new Error('getDevices() did not return an array');
          if (typeof naudiodon.AudioIO !== 'function') throw new Error('AudioIO is not a function');

          console.log(`Electron ${process.versions.electron}`);
          console.log(`Validated ${devices.length} audio device(s)`);
          console.log('AURA native module validation PASSED');
          '@ | Set-Content -Encoding UTF8 'verify-aura-native.cjs'

      - name: Validate naudiodon through Electron
        shell: pwsh
        run: |
          npx electron verify-aura-native.cjs

      - name: Prepare artifact
        shell: pwsh
        run: |
          $artifact = "aura-native-artifact"

          if (Test-Path $artifact) {
            Remove-Item $artifact -Recurse -Force
          }

          New-Item -ItemType Directory -Path "$artifact/node_modules/naudiodon" -Force | Out-Null
          Copy-Item "node_modules/naudiodon/*" "$artifact/node_modules/naudiodon/" -Recurse -Force

          @"
          AURA Native Build
          =================
          Platform: win32
          Architecture: x64
          Electron: $env:ELECTRON_VERSION
          naudiodon: $env:NAUDIODON_VERSION
          Native binary: node_modules/naudiodon/build/Release/naudiodon.node
          "@ | Set-Content -Encoding UTF8 "$artifact/BUILD-INFO.txt"

      - name: Upload AURA native artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-native-win32-x64-electron28
          path: aura-native-artifact
          if-no-files-found: error
          compression-level: 9

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host "AURA native build completed successfully."
          Write-Host "Electron: $env:ELECTRON_VERSION"
          Write-Host "naudiodon: $env:NAUDIODON_VERSION"
