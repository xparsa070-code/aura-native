name: Build AURA Native Module

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/build-native.yml"
      - "main.js"
      - "preload.js"
      - "index.html"

  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/build-native.yml"
      - "main.js"
      - "preload.js"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: aura-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_arch: x64
  npm_config_platform: win32
  npm_config_msvs_version: "2022"
  GYP_MSVS_VERSION: "2022"

jobs:
  build-native:
    name: Build AURA Native Module
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: true

      # ------------------------------------------------------------
      # 3. Setup Python for node-gyp
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 4. Setup Visual Studio/MSVC
      # ------------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # 5. Verify build environment
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "package.json")) {
            throw "package.json was not found."
          }

          $platform = node -p "process.platform"
          $arch = node -p "process.arch"

          Write-Host "Node: $(node --version)"
          Write-Host "npm: $(npm --version)"
          Write-Host "Python: $(python --version)"
          Write-Host "Platform: $platform"
          Write-Host "Architecture: $arch"

          if ($platform -ne "win32") {
            throw "Expected Windows platform, got $platform"
          }

          if ($arch -ne "x64") {
            throw "Expected x64 architecture, got $arch"
          }

          if (!(Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "Microsoft C++ compiler cl.exe was not found."
          }

          if (!(Get-Command msbuild.exe -ErrorAction SilentlyContinue)) {
            throw "MSBuild was not found."
          }

          Write-Host "MSVC and MSBuild are available."

      # ------------------------------------------------------------
      # 6. Configure npm/node-gyp
      # ------------------------------------------------------------
      - name: Configure native build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm config set msvs_version 2022
          npm config set python "$(Get-Command python).Source"

          Write-Host "MSVS version: $(npm config get msvs_version)"
          Write-Host "Python path: $(npm config get python)"

      # ------------------------------------------------------------
      # 7. Install dependencies
      #
      # package-lock.json is not present in the repository.
      # Therefore npm install is used instead of npm ci.
      # npm cache is intentionally disabled.
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_arch: x64
          npm_config_platform: win32
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"
        run: |
          $ErrorActionPreference = "Stop"

          npm install `
            --no-audit `
            --no-fund `
            --prefer-online `
            --foreground-scripts

      # ------------------------------------------------------------
      # 8. Verify installed packages
      # ------------------------------------------------------------
      - name: Verify installed packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "node_modules/electron")) {
            throw "Electron was not installed."
          }

          if (!(Test-Path "node_modules/naudiodon")) {
            throw "naudiodon was not installed."
          }

          npm list electron --depth=0
          npm list naudiodon --depth=0

          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          $naudiodonVersion = node -p "require('./node_modules/naudiodon/package.json').version"

          Write-Host "Electron: $electronVersion"
          Write-Host "naudiodon: $naudiodonVersion"

          "ELECTRON_VERSION=$electronVersion" >> $env:GITHUB_ENV
          "NAUDIODON_VERSION=$naudiodonVersion" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # 9. Rebuild naudiodon for Electron
      # ------------------------------------------------------------
      - name: Rebuild naudiodon for Electron
        shell: pwsh
        env:
          npm_config_arch: x64
          npm_config_platform: win32
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"
        run: |
          $ErrorActionPreference = "Stop"

          npx --yes @electron/rebuild@3.7.1 `
            --force `
            --which-module=naudiodon

      # ------------------------------------------------------------
      # 10. Verify native binary
      # ------------------------------------------------------------
      - name: Verify native binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $native = "node_modules/naudiodon/build/Release/naudiodon.node"

          if (!(Test-Path $native)) {
            throw "Native binary was not created: $native"
          }

          $file = Get-Item $native

          Write-Host "Native binary: $($file.FullName)"
          Write-Host "Native binary size: $($file.Length) bytes"

          if ($file.Length -lt 10000) {
            throw "Native binary is suspiciously small."
          }

      # ------------------------------------------------------------
      # 11. Verify native binary is a Windows x64 PE file
      # ------------------------------------------------------------
      - name: Verify native binary architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = (Resolve-Path "node_modules/naudiodon/build/Release/naudiodon.node").Path
          $bytes = [System.IO.File]::ReadAllBytes($path)

          if ($bytes.Length -lt 64) {
            throw "Invalid PE file."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
            throw "Invalid PE header."
          }

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            $peOffset,
            4
          )

          if ($signature -ne "PE`0`0") {
            throw "The native module is not a valid PE file."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          Write-Host ("PE Machine: 0x{0:X4}" -f $machine)

          if ($machine -ne 0x8664) {
            throw "Native module is not x64."
          }

          Write-Host "Native module architecture confirmed: x64."

      # ------------------------------------------------------------
      # 12. Create Electron validation script
      #
      # IMPORTANT:
      # getDevices() is intentionally not called in CI because
      # GitHub-hosted Windows runners have no reliable audio device.
      # Calling PortAudio/WASAPI there causes native SIGSEGV/h
