name: Build AURA Native Module

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild naudiodon for Electron
        run: npx --yes @electron/rebuild@3.7.1 -f -w naudiodon

      - name: Verify native module exists
        shell: pwsh
        run: |
          $path = "node_modules/naudiodon/build/Release/naudiodon.node"

          if (!(Test-Path $path)) {
            Write-Error "naudiodon.node was not created!"
            exit 1
          }

          Write-Host "Native module found:"
          Get-Item $path

      - name: Verify naudiodon loads in Electron
        shell: pwsh
        run: |
          npx electron -e "const ad = require('./node_modules/naudiodon'); console.log('naudiodon loaded successfully'); console.log(Object.keys(ad));"

      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: aura-naudiodon-win32-x64-electron28
          path: node_modules/naudiodon/build/Release/naudiodon.node
          if-no-files-found: error
